<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Connecting lines to corner nodes -->
  <line x1="16" y1="16" x2="6" y2="6" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="16" y1="16" x2="26" y2="6" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="16" y1="16" x2="6" y2="26" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="16" y1="16" x2="26" y2="26" stroke="#6B7280" stroke-width="1.5"/>
  <!-- Corner nodes -->
  <circle cx="6" cy="6" r="3" fill="#6B7280"/>
  <circle cx="26" cy="6" r="3" fill="#6B7280"/>
  <circle cx="6" cy="26" r="3" fill="#6B7280"/>
  <circle cx="26" cy="26" r="3" fill="#6B7280"/>
  <!-- Center asterisk: diagonal X aligned with connecting lines + vertical/horizontal cross -->
  <line x1="11" y1="11" x2="21" y2="21" stroke="#DA7756" stroke-width="3" stroke-linecap="round"/>
  <line x1="21" y1="11" x2="11" y2="21" stroke="#DA7756" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="9.5" x2="16" y2="22.5" stroke="#DA7756" stroke-width="3" stroke-linecap="round"/>
  <line x1="9.5" y1="16" x2="22.5" y2="16" stroke="#DA7756" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#DA7756"/>
</svg>
